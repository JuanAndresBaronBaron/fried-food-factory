<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Plan de acción | Fritanga</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="styles.css">
  <style>
    .gate { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 40px 16px; }
    .gate-card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 36px 28px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(120,60,10,.1); }
    .gate-card img { width: 64px; margin: 0 auto 14px; }
    .gate-card h1 { font-size: 1.7rem; }
    .gate-card p { color: var(--muted); margin: 0 0 20px; }
    .pin { font-size: 1.8rem; letter-spacing: .5em; text-align: center; width: 100%; padding: 12px 0 12px .5em; border: 2px solid var(--line); border-radius: 14px; font-family: inherit; background: #fff; color: var(--ink); }
    .pin:focus { outline: none; border-color: var(--gold); }
    .gate-card .btn { width: 100%; justify-content: center; margin-top: 14px; }
    .err { color: var(--red); font-weight: 600; min-height: 1.6em; margin-top: 10px; }
    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }

    #plan { padding: 48px 0 72px; }
    #plan[hidden] { display: none; }
    .plan-top { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .pl-intro { margin-bottom: 28px; }
    .pl-h { font-size: 1.7rem; margin: 48px 0 16px; padding-top: 18px; border-top: 2px solid var(--line); }
    .pl-h small { font-family: "Inter", sans-serif; font-size: .95rem; color: var(--muted); font-weight: 600; }
    .pl-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tl { background: var(--red); color: #fff; border-radius: 16px; padding: 18px; }
    .tl span { font-weight: 800; font-family: "Fraunces", serif; font-size: 1.1rem; color: var(--gold-soft); }
    .tl p { margin: 6px 0 0; color: #ffe9e6; }
    .eric { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .e { border-radius: 16px; padding: 20px; border: 1px solid var(--line); background: var(--paper); border-left: 8px solid; }
    .e h3 { margin-bottom: 6px; }
    .e p { margin: 0; color: var(--muted); }
    .e-el { border-left-color: #b3261e; } .e-re { border-left-color: #e07b16; }
    .e-in { border-left-color: #2f7d32; } .e-cr { border-left-color: #1f6fb3; }
    .pl-steps, .pl-list { padding-left: 1.2em; display: grid; gap: 8px; }
    .pl-warn { background: #fff4d1; border: 1px solid #f2d27a; border-radius: 12px; padding: 14px 16px; }
    .visits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
    .v { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .v span { display: inline-block; background: var(--gold-soft); color: var(--red-dark); font-weight: 700; padding: 3px 10px; border-radius: 999px; font-size: .85rem; margin-bottom: 8px; }
    .v p { margin: 0; color: var(--muted); }
    .pl-table { width: 100%; border-collapse: collapse; background: var(--paper); border-radius: 12px; overflow: hidden; font-size: .95rem; }
    .pl-table th, .pl-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .pl-table th { background: var(--gold-soft); }
    .pl-table td { color: var(--muted); font-style: italic; }
    .pl-big { font-family: "Fraunces", serif; font-size: 1.4rem; background: var(--paper); border: 2px dashed var(--gold); border-radius: 16px; padding: 22px; }
    @media (max-width: 860px) {
      .pl-timeline, .visits { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .pl-timeline, .visits, .eric { grid-template-columns: 1fr; }
      .pl-table { font-size: .82rem; }
    }
    @media print {
      .site-header, .plan-top, .no-print { display: none !important; }
      body { background: #fff; }
      .tl, .e, .pl-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="">Fritanga</a>
      <nav class="nav">

  <div class="gate" id="gate">

      <h1>Plan de acción</h1>

      <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="PIN" required>

  <main id="plan" hidden>
    <div class="wrap">
      <div class="plan-top">
        <button class="btn btn-ghost" type="button" onclick="window.print()">Imprimir plan</button>
        <button class="btn btn-ghost" type="button" id="lock">Cerrar</button>
      </div>
      <div id="planBody"></div>
    </div>
  </main>

  <script src="assets/plan-data.js"></script>
  <script>
    // El plan va cifrado (AES-GCM) con una clave derivada del PIN.
    // Es una protección básica: sirve para que no lo vea cualquiera, no es seguridad fuerte.
    const $ = (id) => document.getElementById(id);
    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    async function unlock(pin) {
      const d = window.PLAN_DATA;
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromB64(d.salt), iterations: d.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(d.iv) }, key, fromB64(d.data));
      return new TextDecoder().decode(plain);
    }

    function show(html) {
      $("planBody").innerHTML = html;
      $("gate").hidden = true;
      $("gate").style.display = "none";
      $("plan").hidden = false;
      window.scrollTo(0, 0);
    }

    $("gateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pin = $("pin").value.trim();
      $("go").disabled = true;
      $("err").textContent = "";
      try {
        const html = await unlock(pin);
        try { sessionStorage.setItem("fritanga-pin", pin); } catch (_) {}
        show(html);
      } catch (_) {
        $("err").textContent = "PIN incorrecto. Intenta de nuevo.";
        $("gateForm").classList.remove("shake"); void $("gateForm").offsetWidth;
        $("gateForm").classList.add("shake");
        $("pin").value = "";
        $("pin").focus();
      } finally {
        $("go").disabled = false;
      }
    });

    $("lock").addEventListener("click", () => {
      try { sessionStorage.removeItem("fritanga-pin"); } catch (_) {}
      location.reload();
    });

    (async () => {
      let saved = null;
      try { saved = sessionStorage.getItem("fritanga-pin"); } catch (_) {}
      if (saved) { try { show(await unlock(saved)); return; } catch (_) {} }
      $("pin").focus();
    })();
  </script>
