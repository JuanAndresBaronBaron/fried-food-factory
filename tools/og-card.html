<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; background: radial-gradient(700px 500px at 85% 40%, #ffe0a0, transparent 65%), #fff8ec; position: relative; }
  .band { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #b3261e; }
  .copy { position: absolute; left: 80px; top: 80px; width: 560px; }
  .logo { display: flex; align-items: center; gap: 16px; font-family: Fraunces, serif; font-weight: 800; font-size: 58px; color: #b3261e; }
  .logo img { width: 72px; }
  h1 { font-family: Fraunces, serif; font-weight: 800; font-size: 64px; line-height: 1.04; color: #2b1a12; margin-top: 34px; letter-spacing: -.01em; }
  h1 span { color: #b3261e; }
  p { margin-top: 26px; font-size: 26px; color: #6e5646; font-weight: 600; }
  .plate { position: absolute; right: 70px; top: 85px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0 58%, #fbf1df 59% 66%, #fff 67%); box-shadow: 0 30px 70px rgba(110,55,10,.2); }
  .ph { position: absolute; filter: drop-shadow(0 14px 14px rgba(110,55,10,.35)); }
  .p1 { width: 330px; right: 135px; top: 150px; transform: rotate(-5deg); }
  .p2 { width: 233px; right: 300px; top: 300px; transform: rotate(7deg); }
  .p3 { width: 233px; right: 95px; top: 305px; transform: rotate(-8deg); }
  .sticker { position: absolute; right: 60px; top: 70px; width: 120px; height: 120px; border-radius: 50%; background: #b3261e; color: #fff; display: grid; place-items: center; text-align: center; font-family: Fraunces, serif; font-weight: 800; font-size: 20px; line-height: 1.05; transform: rotate(12deg); }
  .sticker b { display: block; font-size: 34px; color: #fde7b0; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="copy">
    <div class="logo"><img src="../assets/logo.svg" alt="">Fritanga</div>
    <h1>Empanadas artesanales, <span>listas para freír y vender.</span></h1>
    <p>Carne · Pollo · Chicharrón<br>Pereira y Dosquebradas</p>
  </div>
  <div class="plate"></div>
  <img class="ph p1" src="../assets/foto-chicharron.webp" alt="">
  <img class="ph p2" src="../assets/foto-carne.webp" alt="">
  <img class="ph p3" src="../assets/foto-pollo.webp" alt="">
  <div class="sticker"><span><b>100 %</b>maíz</span></div>
</body>
</html>
