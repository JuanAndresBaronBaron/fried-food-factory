<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; background: radial-gradient(700px 500px at 85% 40%, #ffe0a0, transparent 65%), radial-gradient(600px 320px at 10% 0%, #e3f2f9, transparent 70%), #fff8ec; position: relative; }
  .copy { position: absolute; left: 64px; top: 46px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { height: 176px; filter: drop-shadow(0 10px 14px rgba(74, 38, 23, .25)); }
  .brand span { font-family: Fraunces, serif; font-weight: 800; font-size: 60px; line-height: .98; color: #4a2617; letter-spacing: -.01em; }
  .brand em { font-style: normal; color: #b3261e; display: block; }
  h1 { font-family: Fraunces, serif; font-weight: 800; font-size: 50px; line-height: 1.06; color: #2b1a12; margin-top: 26px; letter-spacing: -.01em; }
  h1 span { color: #b3261e; }
  p { margin-top: 18px; font-size: 24px; color: #2f7d32; font-weight: 700; }
  .plate { position: absolute; right: 70px; top: 60px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0 58%, #fbf1df 59% 66%, #fff 67%); box-shadow: 0 30px 70px rgba(110,55,10,.2); }
  .ph { position: absolute; filter: drop-shadow(0 14px 14px rgba(110,55,10,.35)); }
  .p1 { width: 316px; right: 132px; top: 122px; transform: rotate(-5deg); }
  .p2 { width: 224px; right: 292px; top: 266px; transform: rotate(7deg); }
  .p3 { width: 224px; right: 92px; top: 272px; transform: rotate(-8deg); }
  .sticker { position: absolute; right: 56px; top: 44px; width: 116px; height: 116px; border-radius: 50%; background: #b3261e; color: #fff; display: grid; place-items: center; text-align: center; font-family: Fraunces, serif; font-weight: 800; font-size: 19px; line-height: 1.05; transform: rotate(12deg); }
  .sticker b { display: block; font-size: 32px; color: #fde7b0; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 1200px; height: 92px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../assets/logo-480.webp" alt=""><span>Empanadas <em>del Eje</em></span></div>
    <h1>Empanadas artesanales, <span>listas para freír y vender.</span></h1>
    <p>Carne · Pollo · Chicharrón · Masa 100 % de maíz</p>
  </div>
  <div class="plate"></div>
  <img class="ph p1" src="../assets/foto-chicharron.webp" alt="">
  <img class="ph p2" src="../assets/foto-carne.webp" alt="">
  <img class="ph p3" src="../assets/foto-pollo.webp" alt="">
  <div class="sticker"><span><b>100 %</b>maíz</span></div>
  <svg class="hills" viewBox="0 0 1200 92" preserveAspectRatio="none" aria-hidden="true"><path d="M0 92 V44 C 150 14, 300 18, 430 40 S 700 12, 860 26 S 1100 40, 1200 24 V92 Z" fill="#a9d27b"/><path d="M0 92 V62 C 170 40, 350 46, 500 60 S 820 40, 990 52 S 1150 58, 1200 54 V92 Z" fill="#6cb04e"/><path d="M0 92 V78 C 200 66, 420 70, 600 78 S 1000 66, 1200 74 V92 Z" fill="#3f8f3c"/></svg>
</body>
</html>
